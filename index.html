<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>અષ્ટોપઘડી — Ashto Paghadi</title>
<style>
:root {
  --bg:#f4ead7;
  --ink:#2e2922;
  --card:#fff9ee;
  --line:#9a805e;
  --accent:#176b63;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:radial-gradient(circle at top,#fffaf0,#ead9bb);
  color:var(--ink);
  font-family:system-ui,sans-serif;
  min-height:100vh;
}
button { font:inherit;cursor:pointer;border:0 }
.app { max-width:1250px;margin:auto;padding:16px }
header {
  display:flex;justify-content:space-between;gap:12px;
  align-items:center;flex-wrap:wrap
}
h1 { margin:0;font-size:clamp(26px,4vw,42px) }
.sub { opacity:.7 }
.toolbar { display:flex;gap:7px;flex-wrap:wrap }
.toolbar button,.choice {
  padding:10px 13px;border-radius:12px;background:#fff;
  border:1px solid #c9b99d
}
.primary {
  padding:11px 15px;border-radius:12px;
  background:var(--accent);color:#fff
}
.layout {
  display:grid;grid-template-columns:minmax(300px,1fr) 330px;
  gap:16px;margin-top:15px
}
.board-card,.panel,.start {
  background:#fff9eed9;border:1px solid #cbb895;
  border-radius:22px;box-shadow:0 12px 35px #4c321a18
}
.board-card { padding:14px;overflow:auto }
.board {
  width:min(78vw,760px);min-width:460px;aspect-ratio:1;
  margin:auto;display:grid;grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  background:#d5b785;border:10px solid #806443;
  border-radius:18px
}
.cell {
  position:relative;border:1px solid #9b805e;
  display:flex;align-items:center;justify-content:center;
  background:#f2e2bd
}
.cell.inner { background:#e6d09e }
.cell.safe { background:#ddc887 }
.cell.center { background:#d8b56e }
.x { font-size:30px;opacity:.5;font-weight:900 }
.pieces {
  position:absolute;inset:7%;display:flex;align-items:center;
  justify-content:center;flex-wrap:wrap;gap:2px
}
.cowrie {
  width:clamp(25px,5vw,42px);height:clamp(25px,5vw,42px);
  border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:11px;color:white;
  border:3px solid white;box-shadow:0 2px 6px #0004;
  cursor:pointer
}
.selectable {
  outline:4px solid #ffd45b;
  animation:pulse 1s infinite
}
@keyframes pulse { 50% { transform:scale(1.12) } }
.legend {
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin-top:10px
}
.legend span {
  font-size:12px;background:#fff9ee;border:1px solid #d6c4a4;
  padding:5px 9px;border-radius:999px
}
.panel { padding:16px }
.turn { padding:13px;border-radius:15px;background:#edf5f2 }
.toss {
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin:12px 0
}
.shell {
  height:56px;border-radius:14px;background:#f7efe0;
  border:1px solid #bfae92;display:grid;place-items:center;
  font-size:26px
}
.result {
  font-size:25px;font-weight:900;text-align:center;
  padding:9px;border-radius:12px;background:#fff1c8
}
.actions { display:flex;justify-content:center;margin-top:12px }
.status { display:grid;gap:8px;margin-top:12px }
.player {
  border:1px solid #d2c2a6;border-radius:13px;
  padding:9px;background:#fffdf8
}
.player.active { border:2px solid var(--accent);background:#eef7f4 }
.bar { height:7px;background:#e3d8c4;border-radius:9px;overflow:hidden }
.bar i { display:block;height:100%;background:var(--accent) }
.log { max-height:180px;overflow:auto;margin-top:12px;font-size:13px }
.log div { padding:5px 0;border-bottom:1px dashed #d5c5a9 }
.overlay {
  position:fixed;inset:0;background:#21170dcc;display:none;
  align-items:center;justify-content:center;z-index:20;padding:18px
}
.overlay.show { display:flex }
.modal {
  max-width:560px;width:100%;background:#fff9ee;
  border-radius:24px;padding:25px;text-align:center
}
.modal h2 { font-size:32px }
.start { max-width:650px;margin:40px auto;padding:30px;text-align:center }
.choices { display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px }
.choice.selected { background:var(--accent);color:white }
.hidden { display:none!important }
@media(max-width:850px) {
  .layout { grid-template-columns:1fr }
  .panel { order:-1 }
  .board { width:94vw;min-width:340px }
}
</style>
</head>
<body>

<div class="app" id="start">
  <div class="start">
    <div style="font-size:50px">🐚</div>
    <h1>અષ્ટોપઘડી</h1>
    <div class="sub">ASHTO PAGHADI</div>
    <p>Traditional cowrie board-game prototype</p>
    <div class="choices">
      <button class="choice selected" data-n="2">2 Players</button>
      <button class="choice" data-n="3">3 Players</button>
      <button class="choice" data-n="4">4 Players</button>
    </div>
    <button class="primary" id="startBtn">Start Game</button>
    <p>Local browser prototype — no server required.</p>
  </div>
</div>

<div class="app hidden" id="game">
  <header>
    <h1>અષ્ટોપઘડી <span class="sub">ASHTO PAGHADI</span></h1>
    <div class="toolbar">
      <button id="zin">＋ Zoom</button>
      <button id="zout">− Zoom</button>
      <button id="sound">🔊 Sound</button>
      <button id="new">New Game</button>
    </div>
  </header>
  <div class="layout">
    <section class="board-card">
      <div class="board" id="board"></div>
      <div class="legend">
        <span>✖ Safe house</span>
        <span>Tap a highlighted cowrie</span>
        <span>Stacks move together</span>
      </div>
    </section>
    <aside class="panel">
      <div class="turn" id="turn"></div>
      <div class="toss" id="shells"></div>
      <div class="result" id="result">Ready</div>
      <div class="actions">
        <button class="primary" id="tossBtn">Toss 4 Cowries</button>
      </div>
      <div class="status" id="status"></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div id="icon">🎉</div>
    <h2 id="mtitle"></h2>
    <p id="mtext"></p>
    <button class="primary" id="mcontinue">Continue</button>
  </div>
</div>

<script>
const names=['Player 1','Player 2','Player 3','Player 4'];
const glyph=['♠','◆','▲','✿'];
const colors=['#375a7f','#9b4d3f','#557a4e','#76549a'];
let playersN=2,game=null,zoom=1,soundOn=true;
const $=id=>document.getElementById(id);

document.querySelectorAll('.choice').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    playersN=+b.dataset.n;
  };
});

$('startBtn').onclick=start;
$('new').onclick=()=>{
  game=null;
  $('game').classList.add('hidden');
  $('start').classList.remove('hidden');
};
$('zin').onclick=()=>{zoom=Math.min(1.5,zoom+.1);scale()};
$('zout').onclick=()=>{zoom=Math.max(.7,zoom-.1);scale()};
$('sound').onclick=()=>{
  soundOn=!soundOn;
  $('sound').textContent=soundOn?'🔊 Sound':'🔇 Muted';
};
$('tossBtn').onclick=toss;

function scale(){
  $('board').style.transform='scale('+zoom+')';
}

function start(){
  game={
    turn:0,phase:'toss',toss:null,shells:null,
    players:[],log:[],finished:[]
  };
  for(let i=0;i<playersN;i++){
    game.players.push({
      id:i,name:names[i],glyph:glyph[i],color:colors[i],
      tod:false,natod:false,completed:0,
      pieces:[-1,-1,-1,-1]
    });
  }
  $('start').classList.add('hidden');
  $('game').classList.remove('hidden');
  buildBoard();
  log('Game started. First round is ભગવાનના.');
  render();
}

function buildBoard(){
  const map=[
    ['o9','o8','o7','o6','o5'],
    ['o10','i18','i19','i20','o4'],
    ['o11','i17','c24','i21','o3'],
    ['o12','i16','i23','i22','o2'],
    ['o13','o14','o15','o16','o1']
  ];
  $('board').innerHTML='';
  map.flat().forEach(id=>{
    let c=document.createElement('div');
    c.className='cell';
    let pos;
    if(id==='c24'){
      pos=24;c.classList.add('center','safe');
    } else if(id[0]==='i'){
      pos=+id.slice(1);c.classList.add('inner');
    } else {
      pos=+id.slice(1)-1;c.classList.add('path');
    }
    c.dataset.pos=pos;
    if([1,4,7,10,13].includes(pos)){
      c.classList.add('safe');
      c.insertAdjacentHTML('afterbegin','<span class="x">✖</span>');
    }
    if(pos===24){
      c.insertAdjacentHTML('afterbegin',
        '<span style="opacity:.45;font-size:12px">CENTER</span>');
    }
    let ps=document.createElement('div');
    ps.className='pieces';
    c.appendChild(ps);
    $('board').appendChild(c);
  });
}

function render(){
  document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');
  game.players.forEach((p,pi)=>{
    p.pieces.forEach((pos,idx)=>{
      if(pos<0||pos===24)return;
      let c=[...document.querySelectorAll('.cell')]
        .find(x=>+x.dataset.pos===pos);
      if(!c)return;
      let same=p.pieces.filter(x=>x===pos).length;
      let e=document.createElement('div');
      e.className='cowrie'+(same>1?' stack':'');
      e.style.background=p.color;
      e.textContent=p.glyph+(same>1?same:'');
      e.dataset.p=pi;e.dataset.i=idx;
      c.querySelector('.pieces').appendChild(e);
    });
  });
  panel();
  if(game.phase==='choose')highlight();
}

function panel(){
  let p=game.players[game.turn];
  $('turn').innerHTML='<strong>'+p.name+'</strong><br>'+
    (p.tod?'તોડ મળ્યો! Inner route available':'Outer route');
  $('result').textContent=game.toss==null?'Ready':label(game.toss);
  $('shells').innerHTML='';
  (game.shells||[null,null,null,null]).forEach(x=>{
    let s=document.createElement('div');
    s.className='shell';
    s.textContent=x==null?'🐚':(x?'◒':'◓');
    $('shells').appendChild(s);
  });
  $('status').innerHTML=game.players.map((p,i)=>
    '<div class="player '+(i===game.turn?'active ':'')+
    (p.completed===4?'done':'')+'"><b>'+p.glyph+' '+p.name+
    '</b> '+(p.tod?'• Tod Malyo':'')+
    (p.natod?' • Natod Thaya':'')+
    '<br>Completed: '+p.completed+'/4'+
    '<div class="bar"><i style="width:'+(p.completed*25)+
    '%"></i></div></div>'
  ).join('');
  $('tossBtn').disabled=game.phase!=='toss'||p.completed===4;
}

function label(n){
  return n===8?'અષ્ટો! — 8':n===4?'ચોક્કો! — 4':String(n);
}

function toss(){
  if(game.phase!=='toss')return;
  game.shells=[0,0,0,0].map(()=>Math.random()<.5?0:1);
  let open=game.shells.reduce((a,b)=>a+b,0);
  game.toss=open===0?8:open;
  game.phase='choose';
  tone(game.toss===8?740:game.toss===4?660:440,.12);
  log(game.players[game.turn].name+' tossed '+label(game.toss)+'.');
  render();
  let legal=choices();
  if(!legal.length){
    show('NO MOVE POSSIBLE','Turn passes to the next player.','↪️',
      ()=>next(false));
  } else highlight();
}

function choices(){
  let p=game.players[game.turn],out=[],seen=new Set();
  p.pieces.forEach((pos,i)=>{
    if(pos===24)return;
    if(pos>=0&&!seen.has(pos)){
      seen.add(pos);
      let ids=p.pieces.map((x,j)=>x===pos?j:-1)
        .filter(x=>x>=0);
      let m=move(p,ids[0],game.toss);
      if(m)out.push({ids,pos,m});
    }
  });
  let home=p.pieces.map((x,i)=>x===-1?i:-1).filter(x=>x>=0);
  if(home.length>1){
    for(let n=Math.min(4,home.length);n>=2;n--){
      if(game.toss%n===0){
        out.push({ids:home.slice(0,n),pos:-1,
          m:{steps:game.toss/n,target:0}});
        break;
      }
    }
  }
  if(home.length)
    out.push({ids:[home[0]],pos:-1,m:{steps:1,target:0}});
  return out.filter(x=>{
    let k=x.ids.join(',')+'@'+x.m.target;
    if(seen.has(k))return false;
    seen.add(k);return true;
  });
}

function move(p,i,t){
  let pos=p.pieces[i];
  if(pos===24)return null;
  if(pos===-1)return {steps:1,target:0};
  let size=p.pieces.filter(x=>x===pos).length;
  if(size>1&&t%size!==0)return null;
  let steps=size>1?t/size:t;
  if(pos<16)return {steps,target:(pos+steps)%16};
  let target=pos+steps;
  return target<=24?{steps,target}:null;
}

function highlight(){
  document.querySelectorAll('.cowrie').forEach(e=>{
    e.classList.remove('selectable');
    e.onclick=null;
  });
  choices().forEach(ch=>ch.ids.forEach(i=>{
    let e=document.querySelector(
      '.cowrie[data-p="'+game.turn+'"][data-i="'+i+'"]');
    if(e){
      e.classList.add('selectable');
      e.onclick=()=>doMove(ch);
    }
  }));
}

function doMove(ch){
  if(game.phase!=='choose')return;
  let p=game.players[game.turn];
  let target=ch.m.target,ids=ch.ids.slice(),roll=game.toss;
  game.phase='moving';
  ids.forEach(i=>p.pieces[i]=target);
  render();
  setTimeout(()=>{
    let ev=land(p,ids,target);
    if(target===24){
      ids.forEach(i=>p.pieces[i]=24);
      p.completed=p.pieces.filter(x=>x===24).length;
    }
    render();
    let extra=(roll===4||roll===8||ev.capture||target===24);
    if(target===24){
      show('REACHED 24!','The cowrie reached the centre.','✨',()=>{
        if(p.completed===4)finish(p,extra);
        else if(extra)extraTurn('Reached 24');
        else next(false);
      });
      return;
    }
    if(p.completed===4){finish(p,extra);return}
    if(extra)
      extraTurn(ev.capture?'CAPTURE!':roll===4?'ચોક્કો!':'અષ્ટો!');
    else next(false);
  },420);
}

function land(p,ids,target){
  let capture=false;
  if(target>=0&&target<24){
    game.players.forEach(o=>{
      if(o===p)return;
      let oi=o.pieces.map((x,i)=>x===target?i:-1)
        .filter(i=>i>=0);
      if(!oi.length)return;
      let os=oi.length,is=ids.length;
      if(is===1&&os===1){
        o.pieces[oi[0]]=-1;capture=true;
        log(p.name+' captured '+o.name+"'s cowrie.");
      } else if(is>1&&is===os){
        oi.forEach(i=>o.pieces[i]=-1);
        capture=true;
        log(p.name+' captured an equal stack from '+o.name+'.');
      }
      if(o.pieces.filter(x=>x>=0&&x<24).length===0&&o.tod){
        o.tod=false;o.natod=true;
        log(o.name+': નતોડ થયા');
      }
    });
  }
  if(capture){
    p.tod=true;p.natod=false;
    log(p.name+': તોડ મળ્યો!');
    tone(180,.2);
  }
  return {capture};
}

function extraTurn(reason){
  log(game.players[game.turn].name+' gets an extra turn: '+reason);
  show(reason,'Another toss is awarded.','🔄',()=>{
    game.toss=null;game.shells=null;
    game.phase='toss';render();
  });
}

function next(){
  game.toss=null;game.shells=null;
  let n=0;
  do{
    game.turn=(game.turn+1)%game.players.length;
    n++;
  } while(game.players[game.turn].completed===4&&n<=game.players.length);
  game.phase='toss';render();
}

function finish(p,extra){
  if(game.finished.includes(p.id))return;
  game.finished.push(p.id);
  show('THE WINNER!',p.name+
    ' has completed all 4 cowries. The game continues for the remaining players.',
    '🏆',()=>{
      let left=game.players.filter(x=>x.completed<4);
      if(left.length<=1){
        if(left.length===1)
          show('LAST / LOST THE GAME',
            left[0].name+' is the final remaining player.','❌',()=>{
              game.phase='ended';render();
            });
        else {game.phase='ended';render()}
      } else if(extra)extraTurn('Completion of 24');
      else next(false);
    });
}

function show(title,text,icon,fn){
  $('icon').textContent=icon;
  $('mtitle').textContent=title;
  $('mtext').textContent=text;
  $('overlay').classList.add('show');
  $('mcontinue').onclick=()=>{
    $('overlay').classList.remove('show');
    if(fn)fn();
  };
}

function log(x){
  game.log.unshift(x);
  $('log').innerHTML=game.log.slice(0,25)
    .map(v=>'<div>'+v+'</div>').join('');
}

function tone(f,d){
  if(!soundOn)return;
  try{
    let C=AudioContext||webkitAudioContext;
    let c=new C,o=c.createOscillator(),g=c.createGain();
    o.frequency.value=f;g.gain.value=.035;
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+d);
  }catch(e){}
}
</script>
</body>
</html>
